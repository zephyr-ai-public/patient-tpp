[project]
name = "patient-tpp"
version = "0.1.0"
description = "Zephyr AI Temporal Point Process modeling"
authors = ["Zephyr AI"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "easy-tpp (>=0.2.1,<0.2.2)",
    "matplotlib (>=3.10)",
    "pandas (>=2.3.3,<3.0.0)",
    "pytest (>=9.0.2)",
    "scipy (>=1.16.3)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
